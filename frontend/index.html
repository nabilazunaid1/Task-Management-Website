
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Private Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- LOGIN / REGISTER SCREEN -->
        <section id="authSection">

            <h1>My Task Manager</h1>
            <p>Welcome! Please log in or register.</p>

            <h2 id="authTitle">Log In</h2>

            <form id="authForm">

                <label for="emailInput">Email</label>
                <input
                    type="email"
                    id="emailInput"
                    placeholder="you@example.com"
                    maxlength="254"
                    required
                >

                <label for="passwordInput">Password</label>
                <input
                    type="password"
                    id="passwordInput"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" id="authButton">
                    Log In
                </button>
            </form>

            <p id="authMessage" role="status"></p>

            <p>
                <span id="switchText">
                    Don't have an account?
                </span>

                <button type="button" id="switchAuth">
                    Register
                </button>
            </p>
        </section>


        <!-- PRIVATE TASK DASHBOARD -->
        <section id="dashboardSection" hidden>

            <div class="dashboard-header">
                <div>
                    <h1>My Private Tasks</h1>
                    <p id="welcomeText"></p>
                </div>

                <button type="button" id="logoutButton">
                    Log Out
                </button>
            </div>

            <!-- ADD TASK -->
            <form id="taskForm">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task"
                    maxlength="100"
                    required
                >

                <div class="form-row">

                    <select id="priorityInput">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>
                            Medium Priority
                        </option>
                        <option value="High">High Priority</option>
                    </select>

                    <input type="date" id="dueDateInput">

                </div>

                <button type="submit">Add Task</button>
            </form>

            <!-- SEARCH -->
            <div class="search-section">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search tasks..."
                >
            </div>

            <!-- FILTER -->
            <div class="filter-section">
                <button type="button" data-filter="all">
                    All
                </button>

                <button type="button" data-filter="pending">
                    Pending
                </button>

                <button type="button" data-filter="completed">
                    Completed
                </button>
            </div>

            <h2>My Tasks</h2>

            <ul id="taskList"></ul>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
